name: Update Nepal registrations
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python fetch_regs.py
      - name: Commit if changed
        run: |
          git config user.name "regs-bot"
          git config user.email "regs-bot@users.noreply.github.com"
          git add regs.json
          git diff --cached --quiet || (git commit -m "Update Nepal count" && git push)
